<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0E1726">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Atlas Ruta</title>
  <style>
    :root {
      --bg: #0E1726;
      --panel: rgba(23, 37, 64, 0.92);
      --line: #2B3D62;
      --text: #EAF0FA;
      --muted: #A3B1CB;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    #viewport {
      position: fixed;
      inset: 0;
      overflow: hidden;
      cursor: grab;
      background:
        radial-gradient(1200px 600px at 20% 0%, #172540 0%, transparent 55%),
        var(--bg);
    }
    #viewport.dragging { cursor: grabbing; }
    #world {
      position: absolute;
      left: 0;
      top: 0;
      transform-origin: 0 0;
      will-change: transform;
    }
    #world img {
      display: block;
      width: 11920px;
      height: 4430px;
      max-width: none;
      pointer-events: none;
      -webkit-user-drag: none;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      background: #F6F8FC;
    }
    .hud {
      position: fixed;
      z-index: 5;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.28);
    }
    .title {
      top: calc(12px + env(safe-area-inset-top));
      left: calc(12px + env(safe-area-inset-left));
      right: calc(12px + env(safe-area-inset-right));
      max-width: min(520px, calc(100% - 24px));
      padding: 10px 14px;
      font-size: 0.92rem;
      line-height: 1.3;
    }
    .title strong { display: block; font-size: 1.02rem; }
    .title span { color: var(--muted); font-size: 0.82rem; }
    .tools {
      right: calc(12px + env(safe-area-inset-right));
      bottom: calc(16px + env(safe-area-inset-bottom));
      flex-direction: column;
    }
    .tools button, .hint kbd {
      appearance: none;
      border: 1px solid var(--line);
      background: #0E1726;
      color: var(--text);
      border-radius: 10px;
      min-width: 44px;
      min-height: 44px;
      font: inherit;
      font-size: 1.15rem;
      cursor: pointer;
    }
    .tools button:active { transform: scale(0.96); }
    .zoom-label {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      padding: 2px 0 4px;
      min-width: 44px;
    }
    .hint {
      left: calc(12px + env(safe-area-inset-left));
      bottom: calc(16px + env(safe-area-inset-bottom));
      color: var(--muted);
      font-size: 0.8rem;
      max-width: min(280px, calc(100% - 92px));
      pointer-events: none;
    }
    .cursos-btn {
      top: calc(12px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
      padding: 6px;
    }
    .cursos-btn button {
      appearance: none;
      border: 1px solid var(--line);
      background: #0E1726;
      color: var(--text);
      border-radius: 10px;
      min-height: 40px;
      padding: 0 14px;
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
    }
    #panel {
      position: fixed;
      z-index: 6;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(420px, 100%);
      overflow-y: auto;
      padding: calc(16px + env(safe-area-inset-top)) 18px calc(24px + env(safe-area-inset-bottom));
      background: rgba(14, 23, 38, 0.97);
      border-left: 1px solid var(--line);
      transform: translateX(100%);
      transition: transform 0.22s ease;
      touch-action: pan-y;
      -webkit-user-select: text;
      user-select: text;
    }
    #panel.open { transform: none; }
    #panel header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    #panel h2 { margin: 0; font-size: 1.1rem; }
    #panel header button {
      appearance: none; border: 1px solid var(--line); background: transparent; color: var(--text);
      border-radius: 10px; min-width: 40px; min-height: 40px; font-size: 1.1rem; cursor: pointer;
    }
    #panel .nota { color: var(--muted); font-size: 0.82rem; margin: 8px 0 4px; }
    #panel h3 { margin: 20px 0 6px; font-size: 0.95rem; display: flex; align-items: center; gap: 8px; }
    #panel h3 i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    #panel .esp { margin: 10px 0 0; }
    #panel .esp b { display: block; font-size: 0.86rem; font-weight: 600; }
    #panel .esp small { color: var(--muted); font-size: 0.75rem; }
    #panel ul { margin: 4px 0 0; padding-left: 18px; }
    #panel li { font-size: 0.84rem; margin: 3px 0; color: var(--muted); }
    #panel a { color: #9DB8FF; text-decoration: none; }
    #panel a:hover { text-decoration: underline; }
    @media (max-width: 640px) {
      .hint { display: none; }
      .title { font-size: 0.86rem; right: calc(110px + env(safe-area-inset-right)); }
    }
  </style>
</head>
<body>
  <div id="viewport">
    <div id="world">
      <img src="diagrama.svg" width="11920" height="4430" alt="Atlas Ruta · mapa de conocimiento" draggable="false">
    </div>
  </div>
  <div class="hud title">
    <div>
      <strong>Atlas Ruta</strong>
      <span>Mapa de conocimiento · arrastra para mover · pellizca o rueda para zoom</span>
    </div>
  </div>
  <div class="hud cursos-btn">
    <button type="button" id="openCursos" aria-controls="panel" aria-expanded="false">Cursos</button>
  </div>
  <aside id="panel" aria-label="Cursos sugeridos" aria-hidden="true">
    <header>
      <h2>Cursos sugeridos</h2>
      <button type="button" id="closeCursos" aria-label="Cerrar">✕</button>
    </header>
    <p class="nota">Uno o más cursos gratuitos por camino. Datos de <a href="ruta.json">ruta.json</a>.</p>
    <div id="cursos">Cargando…</div>
  </aside>
  <div class="hud tools">
    <button type="button" id="zoomIn" aria-label="Acercar">+</button>
    <div class="zoom-label" id="zoomPct">100%</div>
    <button type="button" id="zoomOut" aria-label="Alejar">−</button>
    <button type="button" id="fit" aria-label="Ajustar a la pantalla" title="Ajustar">⤢</button>
  </div>
  <div class="hud hint">
    En PC: arrastra, rueda del mouse, teclas + − 0<br>
    En celular: un dedo mueve, dos dedos hacen zoom
  </div>
  <script>
    const W = 11920, H = 4430;
    const MIN = 0.08, MAX = 4;
    const viewport = document.getElementById("viewport");
    const world = document.getElementById("world");
    const zoomPct = document.getElementById("zoomPct");

    let scale = 1, tx = 0, ty = 0;
    let pointers = new Map();
    let lastPinch = null;
    let dragging = false;

    function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }

    function apply() {
      world.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
      zoomPct.textContent = Math.round(scale * 100) + "%";
    }

    function fit() {
      const pad = 28;
      const vw = viewport.clientWidth;
      const vh = viewport.clientHeight;
      scale = Math.min((vw - pad * 2) / W, (vh - pad * 2) / H);
      scale = clamp(scale, MIN, MAX);
      tx = (vw - W * scale) / 2;
      ty = (vh - H * scale) / 2;
      apply();
    }

    function zoomAt(sx, sy, factor) {
      const next = clamp(scale * factor, MIN, MAX);
      const wx = (sx - tx) / scale;
      const wy = (sy - ty) / scale;
      scale = next;
      tx = sx - wx * scale;
      ty = sy - wy * scale;
      apply();
    }

    function centroid(pts) {
      let x = 0, y = 0;
      for (const p of pts) { x += p.x; y += p.y; }
      return { x: x / pts.length, y: y / pts.length };
    }

    function distance(a, b) {
      const dx = a.x - b.x, dy = a.y - b.y;
      return Math.hypot(dx, dy);
    }

    viewport.addEventListener("pointerdown", (e) => {
      viewport.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1) {
        dragging = true;
        viewport.classList.add("dragging");
      } else if (pointers.size === 2) {
        dragging = false;
        const pts = [...pointers.values()];
        lastPinch = { dist: distance(pts[0], pts[1]), mid: centroid(pts) };
      }
    });

    viewport.addEventListener("pointermove", (e) => {
      if (!pointers.has(e.pointerId)) return;
      const prev = pointers.get(e.pointerId);
      const cur = { x: e.clientX, y: e.clientY };
      pointers.set(e.pointerId, cur);

      if (pointers.size === 2) {
        const pts = [...pointers.values()];
        const dist = distance(pts[0], pts[1]);
        const mid = centroid(pts);
        if (lastPinch) {
          zoomAt(mid.x, mid.y, dist / lastPinch.dist);
          tx += mid.x - lastPinch.mid.x;
          ty += mid.y - lastPinch.mid.y;
          apply();
        }
        lastPinch = { dist, mid };
        return;
      }

      if (dragging && pointers.size === 1) {
        tx += cur.x - prev.x;
        ty += cur.y - prev.y;
        apply();
      }
    });

    function endPointer(e) {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) lastPinch = null;
      if (pointers.size === 0) {
        dragging = false;
        viewport.classList.remove("dragging");
      }
    }
    viewport.addEventListener("pointerup", endPointer);
    viewport.addEventListener("pointercancel", endPointer);

    viewport.addEventListener("wheel", (e) => {
      e.preventDefault();
      const factor = e.deltaY < 0 ? 1.12 : 1 / 1.12;
      zoomAt(e.clientX, e.clientY, factor);
    }, { passive: false });

    let lastTap = 0;
    viewport.addEventListener("pointerup", (e) => {
      if (e.pointerType === "mouse") return;
      const now = Date.now();
      if (now - lastTap < 280) zoomAt(e.clientX, e.clientY, 1.6);
      lastTap = now;
    });

    document.getElementById("zoomIn").onclick = () =>
      zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.25);
    document.getElementById("zoomOut").onclick = () =>
      zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.25);
    document.getElementById("fit").onclick = fit;

    window.addEventListener("keydown", (e) => {
      if (e.key === "+" || e.key === "=") {
        zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1.2);
      } else if (e.key === "-" || e.key === "_") {
        zoomAt(viewport.clientWidth / 2, viewport.clientHeight / 2, 1 / 1.2);
      } else if (e.key === "0") {
        fit();
      }
    });

    const panel = document.getElementById("panel");
    const openBtn = document.getElementById("openCursos");
    function setPanel(open) {
      panel.classList.toggle("open", open);
      panel.setAttribute("aria-hidden", String(!open));
      openBtn.setAttribute("aria-expanded", String(open));
    }
    openBtn.onclick = () => setPanel(!panel.classList.contains("open"));
    document.getElementById("closeCursos").onclick = () => setPanel(false);
    window.addEventListener("keydown", (e) => { if (e.key === "Escape") setPanel(false); });
    for (const ev of ["pointerdown", "wheel"]) panel.addEventListener(ev, (e) => e.stopPropagation());

    const NIVELES = { basico: "Básico", intermedio: "Intermedio", avanzado: "Avanzado", universitario: "Universitario" };
    function el(tag, props = {}, ...kids) {
      const n = Object.assign(document.createElement(tag), props);
      n.append(...kids);
      return n;
    }
    fetch("ruta.json")
      .then((r) => r.json())
      .then((data) => {
        const box = document.getElementById("cursos");
        box.textContent = "";
        for (const area of data.areas) {
          const dot = el("i");
          dot.style.background = area.color;
          box.append(el("h3", {}, dot, area.nombre));
          for (const esp of area.especialidades) {
            const ul = el("ul");
            for (const c of esp.cursos || []) {
              ul.append(el("li", {}, el("a", { href: c.url, target: "_blank", rel: "noopener", textContent: c.nombre }), " · " + c.proveedor));
            }
            box.append(el("div", { className: "esp" },
              el("b", { textContent: esp.nombre }),
              el("small", { textContent: "Desde " + NIVELES[esp.inicio] + " · " + esp.temas.length + " temas" }),
              ul));
          }
        }
      })
      .catch(() => { document.getElementById("cursos").textContent = "No se pudo cargar ruta.json."; });

    window.addEventListener("resize", fit);
    const img = world.querySelector("img");
    if (img.complete) fit();
    else img.addEventListener("load", fit);
  </script>
</body>
</html>
